<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDNIS-OS | The Creator Linux Distribution</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: rgba(18, 10, 36, 0.4);
            --border-color: rgba(147, 51, 234, 0.2);
            --primary-glow: #a855f7;
            --secondary-glow: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Ambient Fluid Background Elements */
        .ambient-glow-top {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, rgba(59,130,246,0.1) 40%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .ambient-glow-bottom {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(168,85,247,0.08) 50%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gh-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .gh-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .hero {
            max-width: 1000px;
            margin: 40px auto 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        /* Circular Logo Frame Container */
        .logo-container {
            margin-bottom: 24px;
            display: inline-block;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-glow);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--primary-glow);
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffffff 30%, #c084fc 70%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 40px auto;
            font-weight: 300;
        }

        /* Action Buttons */
        .cta-container {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px;
            border-radius: 100px;
            backdrop-filter: blur(10px);
            margin-bottom: 60px;
        }

        .btn-main {
            background: linear-gradient(90deg, #a855f7, #6366f1);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(168, 85, 247, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            padding: 14px 28px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            color: var(--primary-glow);
        }

        /* Video Showcase Element Layout */
        .video-wrapper {
            max-width: 900px;
            margin: 0 auto 80px auto;
            padding: 0 20px;
        }

        .video-frame {
            position: relative;
            background: rgba(10, 5, 20, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.1);
            backdrop-filter: blur(20px);
        }

        video {
            width: 100%;
            display: block;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Technical Specification Matrices */
        .grid-container {
            max-width: 1100px;
            margin: 0 auto 80px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2.5rem;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            backdrop-filter: blur(12px);
            position: relative;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #ffffff;
            border-left: 3px solid var(--primary-glow);
            padding-left: 12px;
        }

        .tech-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tech-table th {
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tech-table td {
            padding: 14px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tech-table tr:last-child td {
            border-bottom: none;
        }

        .tech-label {
            color: var(--text-muted);
            font-weight: 400;
        }

        .tech-value {
            font-family: monospace;
            color: #e5e7eb;
            text-align: right;
        }

        .tech-value.highlight {
            color: #c084fc;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom"></div>

    <header>
        <div class="logo">IDNIS-OS</div>
        <a href="https://github.com/sindipopshini22-commits/idnis-os" class="gh-btn" target="_blank">GitHub Repo</a>
    </header>

    <section class="hero">
        <!-- Render custom calico logo graphic element asset cleanly -->
        <div class="logo-container">
            <img src="pici_cat.jpg" alt="IDNIS-OS Pici Logo" class="logo-img">
        </div>

        <div class="tagline">We Are Opticore Architecture</div>
        <h1>The Creator Linux Distribution</h1>
        <p class="description">
            An independent standalone amd64 operating system engineered directly stack-up from a Debian Bookworm base. Featuring native hardware virtualization and structural micro-layers.
        </p>

        <div class="cta-container">
